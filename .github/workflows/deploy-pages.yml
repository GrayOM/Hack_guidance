name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure pnpm
        uses: pnpm/action-setup@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Verify client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xouowashfoyobgcdtagt.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_3hgnIxSMX-B5D_C8Y8Eh_Q_hUtC9qnl' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "VITE_SUPABASE_URL is empty"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty"; exit 1; }
      - name: Build static app
        env:
          VITE_EXTERNAL_SUPABASE: "true"
          VITE_SUPABASE_AUTH_PROVIDER: "email"
          # Repository variables of the same name override these. Rotating the key is a settings
          # change, not a code change. The publishable key is public by design.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://xouowashfoyobgcdtagt.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_3hgnIxSMX-B5D_C8Y8Eh_Q_hUtC9qnl' }}
        run: pnpm build:github-pages
      - name: Provide SPA route fallback
        run: cp dist/public/index.html dist/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
